name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Lets an already-tagged release be rebuilt manually (Actions tab -> Release
  # -> Run workflow -> pick the vX.Y.Z tag as the ref) to backfill assets a
  # workflow change added after that release was first created — e.g. the
  # bootloader/partitions/boot_app0 parts pages.yml needs, added after v1.0.0
  # had already shipped with only the app binary. `draft` below is
  # conditioned on this vs. the tag-push trigger specifically so re-running
  # it against an already-published release can't silently revert it to
  # draft.
  workflow_dispatch:

permissions:
  contents: write # needed to publish the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # docs/ROADMAP.md's Versioning section previously noted that a
      # tag/version.h mismatch was "a review-time catch, not an automated
      # one". It is automated now: shipping a binary whose boot banner
      # disagrees with its release tag makes every subsequent bug report
      # ambiguous, and that is exactly the cost this project keeps paying
      # when hardware facts and code drift apart.
      - name: Verify version.h matches the release tag
        run: |
          header_version="$(sed -n 's/^#define FIRMWARE_VERSION "\(.*\)"/\1/p' src/version.h)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "version.h: '${header_version}'   tag: '${tag_version}'"
          if [ -z "$header_version" ]; then
            echo "::error::Could not parse FIRMWARE_VERSION from src/version.h"
            exit 1
          fi
          if [ "$header_version" != "$tag_version" ]; then
            echo "::error::src/version.h says ${header_version} but the tag is ${GITHUB_REF_NAME}. Bump version.h to match before tagging (docs/ROADMAP.md Versioning)."
            exit 1
          fi

      - name: Build firmware
        run: pio run -e cardputer-adv

      - name: Rename binary for Launcher / SD-drop distribution
        run: |
          mkdir -p dist
          cp .pio/build/cardputer-adv/firmware.bin "dist/LoRaTraceRX-${GITHUB_REF_NAME}.bin"

      # bootloader.bin/partitions.bin plus the Arduino core's boot_app0.bin
      # are the other three pieces a from-scratch flash needs beside the
      # app image above (see the exact esptool offsets in pages.yml). Only
      # the app image was ever needed for Launcher/SD-drop installs, which
      # is why these weren't published before now — the web flasher
      # (pages.yml) is what actually consumes them.
      - name: Collect flash parts for the web flasher
        run: |
          cp .pio/build/cardputer-adv/bootloader.bin "dist/LoRaTraceRX-${GITHUB_REF_NAME}-bootloader.bin"
          cp .pio/build/cardputer-adv/partitions.bin "dist/LoRaTraceRX-${GITHUB_REF_NAME}-partitions.bin"
          boot_app0="$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n1)"
          cp "$boot_app0" "dist/LoRaTraceRX-${GITHUB_REF_NAME}-boot_app0.bin"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LoRaTraceRX-${{ github.ref_name }}*.bin
          draft: ${{ github.event_name != 'workflow_dispatch' }}
          generate_release_notes: true

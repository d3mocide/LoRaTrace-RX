name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # needed to publish the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # docs/ROADMAP.md's Versioning section previously noted that a
      # tag/version.h mismatch was "a review-time catch, not an automated
      # one". It is automated now: shipping a binary whose boot banner
      # disagrees with its release tag makes every subsequent bug report
      # ambiguous, and that is exactly the cost this project keeps paying
      # when hardware facts and code drift apart.
      - name: Verify version.h matches the release tag
        run: |
          header_version="$(sed -n 's/^#define FIRMWARE_VERSION "\(.*\)"/\1/p' src/version.h)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "version.h: '${header_version}'   tag: '${tag_version}'"
          if [ -z "$header_version" ]; then
            echo "::error::Could not parse FIRMWARE_VERSION from src/version.h"
            exit 1
          fi
          if [ "$header_version" != "$tag_version" ]; then
            echo "::error::src/version.h says ${header_version} but the tag is ${GITHUB_REF_NAME}. Bump version.h to match before tagging (docs/ROADMAP.md Versioning)."
            exit 1
          fi

      - name: Build firmware
        run: pio run -e cardputer-adv

      - name: Rename binary for Launcher / SD-drop distribution
        run: |
          mkdir -p dist
          cp .pio/build/cardputer-adv/firmware.bin "dist/LoRaTraceRX-${GITHUB_REF_NAME}.bin"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LoRaTraceRX-${{ github.ref_name }}.bin
          draft: true
          generate_release_notes: true

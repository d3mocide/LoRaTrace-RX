name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e cardputer-adv

      - name: Rename binary for Launcher / SD-drop distribution
        run: |
          mkdir -p dist
          cp .pio/build/cardputer-adv/firmware.bin "dist/LoRaTraceRX-${GITHUB_REF_NAME}.bin"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LoRaTraceRX-${{ github.ref_name }}.bin
          draft: true
          generate_release_notes: true

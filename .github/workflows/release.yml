name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Lets an already-tagged release be rebuilt manually (Actions tab -> Release
  # -> Run workflow) to backfill assets a workflow change added after that
  # release was first created — e.g. the bootloader/partitions/boot_app0
  # parts pages.yml needs, added after v1.0.0 had already shipped with only
  # the app binary. This can't dispatch against the vX.Y.Z tag itself as the
  # ref: GitHub only allows workflow_dispatch against a ref whose own copy of
  # the workflow file already defines the trigger, and a tag cut before this
  # trigger existed never will (confirmed 2026-09-03 trying exactly this
  # against v1.0.0). So instead this always runs from a branch (main) and
  # takes the target release tag as an input — but checks that tag out as
  # the build source (see the checkout step), so a dispatch builds the
  # commit the release was actually cut from rather than the dispatch
  # branch's tip.
  # `draft` is conditioned on workflow_dispatch vs. the tag-push trigger so
  # re-running this against an already-published release can't silently
  # revert it to draft.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the built assets to, e.g. v1.0.0"
        required: true

# Read-only at workflow scope; each job raises only what it needs (audit
# A17). dispatch-deploy already did this for `actions: write`.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the release and its assets
    steps:
      # On a tag push this is the tagged commit already. On a manual
      # dispatch it must be made so explicitly: GitHub only allows
      # workflow_dispatch against a ref whose own copy of this file declares
      # the trigger, so the run is always started from a branch (main) — but
      # nothing forces the *source* to come from that branch. Without this,
      # a dispatch builds main's tip and uploads it onto an older release,
      # and the version check below is the only thing standing in the way.
      # That check compares a version string to a tag name, so it cannot
      # tell "1.0.5 built from the v1.0.5 commit" from "1.0.5 built from a
      # later commit that still says 1.0.5" — which is exactly the state
      # main was in on 2026-09-04. Checking out the tag makes the check a
      # second line of defence instead of the only one.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # Pinned, not --upgrade: a release must be reproducible from its tag,
      # and "whatever PlatformIO published this morning" is not a pin
      # (audit A17). Bump deliberately, alongside a build that was tested.
      - name: Install PlatformIO
        run: pip install "platformio==6.1.19"

      # The tag reaches the shell through the environment, never through
      # ${{ }} interpolation that would generate shell text from a manual
      # input (audit A17). It is also syntax-checked here, so a malformed or
      # hostile input fails before it is used to build file paths below.
      - name: Resolve target release tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Refusing tag '$tag': expected vMAJOR.MINOR.PATCH" >&2; exit 1 ;;
          esac
          printf 'value=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      # docs/ROADMAP.md's Versioning section previously noted that a
      # tag/version.h mismatch was "a review-time catch, not an automated
      # one". It is automated now: shipping a binary whose boot banner
      # disagrees with its release tag makes every subsequent bug report
      # ambiguous, and that is exactly the cost this project keeps paying
      # when hardware facts and code drift apart. Since the checkout step
      # now resolves the target tag itself, this is a second line of
      # defence rather than the only one — it still catches a tag whose own
      # version.h never matched it, which the checkout cannot.
      - name: Verify version.h matches the target release tag
        run: |
          target_tag="${{ steps.tag.outputs.value }}"
          header_version="$(sed -n 's/^#define FIRMWARE_VERSION "\(.*\)"/\1/p' src/version.h)"
          tag_version="${target_tag#v}"
          echo "version.h: '${header_version}'   target tag: '${tag_version}'"
          if [ -z "$header_version" ]; then
            echo "::error::Could not parse FIRMWARE_VERSION from src/version.h"
            exit 1
          fi
          if [ "$header_version" != "$tag_version" ]; then
            echo "::error::src/version.h says ${header_version} but the target release tag is ${target_tag}. Checked-out ref must build the same firmware that tag represents (docs/ROADMAP.md Versioning)."
            exit 1
          fi

      # Same "make it a build failure, not a review-time catch" reasoning as
      # the version check above: a release without operator-facing notes is
      # a release nobody can read. Checked here, before the build, so the
      # failure is fast and obvious rather than arriving after a full
      # PlatformIO compile.
      - name: Verify release notes exist for this tag
        run: python3 scripts/extract_release_notes.py "${{ steps.tag.outputs.value }}" --check

      # The same tests the branch runs, on the exact commit being published.
      # build.yml proves main was green; it does not prove this tag is
      # (audit A17).
      - name: Run unit tests (native) on the release ref
        run: pio test -e native

      - name: Build firmware
        run: pio run -e cardputer-adv

      - name: Rename binary for Launcher / SD-drop distribution
        run: |
          mkdir -p dist
          cp .pio/build/cardputer-adv/firmware.bin "dist/LoRaTraceRX-${{ steps.tag.outputs.value }}.bin"

      # bootloader.bin/partitions.bin plus the Arduino core's boot_app0.bin
      # are the other three pieces a from-scratch flash needs beside the
      # app image above (see the exact esptool offsets in pages.yml). Only
      # the app image was ever needed for Launcher/SD-drop installs, which
      # is why these weren't published before now — the web flasher
      # (pages.yml) is what actually consumes them.
      - name: Collect flash parts for the web flasher
        run: |
          cp .pio/build/cardputer-adv/bootloader.bin "dist/LoRaTraceRX-${{ steps.tag.outputs.value }}-bootloader.bin"
          cp .pio/build/cardputer-adv/partitions.bin "dist/LoRaTraceRX-${{ steps.tag.outputs.value }}-partitions.bin"
          boot_app0="$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n1)"
          cp "$boot_app0" "dist/LoRaTraceRX-${{ steps.tag.outputs.value }}-boot_app0.bin"

      # Every published part, not just the app image: a flasher writes all
      # four, so all four need something to check them against (audit A17).
      - name: Publish checksums and build provenance
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          ( cd dist && sha256sum ./*.bin > "LoRaTraceRX-${TAG}-SHA256SUMS.txt" )
          {
            echo "tag=${TAG}"
            echo "commit=${GITHUB_SHA}"
            echo "firmware_version=$(sed -n 's/^#define FIRMWARE_VERSION "\(.*\)"/\1/p' src/version.h)"
            echo "platformio=$(pio --version)"
            echo "built_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run=${GITHUB_RUN_ID}"
          } > "dist/LoRaTraceRX-${TAG}-BUILDINFO.txt"
          pio pkg list -e cardputer-adv >> "dist/LoRaTraceRX-${TAG}-BUILDINFO.txt" || true
          cat "dist/LoRaTraceRX-${TAG}-SHA256SUMS.txt"

      # body_path carries docs/RELEASE_NOTES.md's curated section rather than
      # GitHub's auto-generated commit list, which is not something an
      # operator can read. Both body_path and generate_release_notes are
      # empty/false on a workflow_dispatch backfill: that path exists only to
      # attach missing asset files to an already-published release, and must
      # never rewrite its body or name. An empty body_path is treated as
      # unset by the action, leaving the existing body alone.
      - name: Render release notes
        run: |
          python3 scripts/extract_release_notes.py "${{ steps.tag.outputs.value }}" \
            > release-body.md
          echo "--- release body ---"; cat release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: |
            dist/LoRaTraceRX-${{ steps.tag.outputs.value }}*.bin
            dist/LoRaTraceRX-${{ steps.tag.outputs.value }}-SHA256SUMS.txt
            dist/LoRaTraceRX-${{ steps.tag.outputs.value }}-BUILDINFO.txt
          draft: ${{ github.event_name != 'workflow_dispatch' }}
          body_path: ${{ github.event_name == 'push' && 'release-body.md' || '' }}
          generate_release_notes: false

  # Runs once the job above has finished uploading this tag's assets --
  # `needs:` orders that by construction, unlike pages.yml's old approach of
  # reacting to this workflow's completion as an event, which could still
  # arrive before the upload step actually finished. A draft release (the
  # normal push-triggered case) is invisible to pages.yml's `gh release
  # view` regardless, so dispatching here doesn't leak it early; it only
  # ever surfaces a release once it's actually published, same as before.
  dispatch-deploy:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-trigger the web flasher deploy now that assets are attached
        run: gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # needed to move the dev-latest tag and publish its release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # jgromes/RadioLib and the other lib_deps come from PlatformIO's
      # registry over HTTP; that registry occasionally throws a bare
      # HTTPClientError on an otherwise-fine commit (seen 2026-08-26, run
      # #78 — 77 prior runs had installed the same pins without issue).
      # Retrying just this network step, separate from the compile steps
      # below, means a registry blip doesn't fail the build and a real
      # compile error still fails on the first attempt.
      - name: Install project dependencies
        run: |
          for attempt in 1 2 3; do
            pio pkg install -e cardputer-adv -e gps-probe -e native && exit 0
            echo "::warning::pio pkg install failed (attempt $attempt/3)"
            sleep $((attempt * 15))
          done
          echo "::error::pio pkg install failed after 3 attempts"
          exit 1

      - name: Build firmware
        run: pio run -e cardputer-adv

      # The GPS bring-up probe (src/gps_probe.cpp) ships in the repo as a
      # flashable diagnostic, so it needs to actually compile — but it isn't
      # part of the firmware build above, which would otherwise let it rot
      # unnoticed until someone flashed a broken sketch while debugging
      # hardware. Cheap to guard here; it reuses the same cached toolchain.
      - name: Build GPS probe
        run: pio run -e gps-probe

      - name: Run unit tests (native)
        run: pio test -e native

      - name: Report firmware size
        run: |
          echo '### Firmware size' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la .pio/build/cardputer-adv/firmware.bin >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: .pio/build/cardputer-adv/firmware.bin
          retention-days: 14

      # Rolling "latest main" build, separate from the versioned vX.Y.Z
      # releases in release.yml. Overwrites the same dev-latest tag/release
      # on every merge so there's always a one-click, no-login download for
      # SD-drop/Launcher testing — see the root README's install guidance.
      # Only on pushes to main (not PRs, not every commit on a branch).
      - name: Move dev-latest tag
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git tag -f dev-latest
          git push origin -f dev-latest

      - name: Rename binary for dev release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p dist
          cp .pio/build/cardputer-adv/firmware.bin dist/LoRaTraceRX-dev.bin

      # Same three extra parts as release.yml's "Collect flash parts" step
      # — the web flasher (pages.yml) needs bootloader/partitions/boot_app0
      # in addition to the app image to write a blank device from scratch.
      - name: Collect flash parts for the web flasher
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cp .pio/build/cardputer-adv/bootloader.bin dist/LoRaTraceRX-dev-bootloader.bin
          cp .pio/build/cardputer-adv/partitions.bin dist/LoRaTraceRX-dev-partitions.bin
          boot_app0="$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n1)"
          cp "$boot_app0" dist/LoRaTraceRX-dev-boot_app0.bin

      - name: Update rolling dev release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "Dev build (latest main)"
          body: |
            Automatically rebuilt from the latest commit on `main`
            (${{ github.sha }}). **Not a tagged release** — may be broken,
            untested on hardware, or mid-phase. Check docs/STATUS.md on
            that commit for what's actually verified before trusting this
            build.

            Stable download link (always the current main):
            https://github.com/${{ github.repository }}/releases/download/dev-latest/LoRaTraceRX-dev.bin
          prerelease: true
          files: dist/LoRaTraceRX-dev*.bin

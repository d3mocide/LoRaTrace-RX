name: Build

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. The one job that needs to write raises it for itself
# (audit A17): a workflow-scope write token is handed to every step,
# including dependency installation and compilation of a pull request's code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      # Pinned rather than --upgrade so a green build stays reproducible and
      # a PlatformIO release cannot change what "passing" means overnight
      # (audit A17).
      - name: Install PlatformIO
        run: pip install "platformio==6.1.19"

      # jgromes/RadioLib and the other lib_deps come from PlatformIO's
      # registry over HTTP; that registry occasionally throws a bare
      # HTTPClientError on an otherwise-fine commit (seen 2026-08-26, run
      # #78 — 77 prior runs had installed the same pins without issue).
      # Retrying just this network step, separate from the compile steps
      # below, means a registry blip doesn't fail the build and a real
      # compile error still fails on the first attempt.
      - name: Install project dependencies
        run: |
          for attempt in 1 2 3; do
            pio pkg install -e cardputer-adv -e gps-probe -e native && exit 0
            echo "::warning::pio pkg install failed (attempt $attempt/3)"
            sleep $((attempt * 15))
          done
          echo "::error::pio pkg install failed after 3 attempts"
          exit 1

      - name: Build firmware
        run: pio run -e cardputer-adv

      # The GPS bring-up probe (src/gps_probe.cpp) ships in the repo as a
      # flashable diagnostic, so it needs to actually compile — but it isn't
      # part of the firmware build above, which would otherwise let it rot
      # unnoticed until someone flashed a broken sketch while debugging
      # hardware. Cheap to guard here; it reuses the same cached toolchain.
      - name: Build GPS probe
        run: pio run -e gps-probe

      - name: Run unit tests (native)
        run: pio test -e native

      - name: Report firmware size
        run: |
          echo '### Firmware size' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la .pio/build/cardputer-adv/firmware.bin >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Staged here, in the job that compiled them, so publish-dev can hand
      # over exactly what was tested instead of building a second time.
      - name: Stage flash parts
        run: |
          mkdir -p dist
          cp .pio/build/cardputer-adv/firmware.bin dist/LoRaTraceRX-dev.bin
          cp .pio/build/cardputer-adv/bootloader.bin dist/LoRaTraceRX-dev-bootloader.bin
          cp .pio/build/cardputer-adv/partitions.bin dist/LoRaTraceRX-dev-partitions.bin
          boot_app0="$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n1)"
          cp "$boot_app0" dist/LoRaTraceRX-dev-boot_app0.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flash-parts-${{ github.sha }}
          path: dist
          retention-days: 14

  # Publishing is the only thing here that needs a write token, so it is the
  # only thing that gets one (audit A17). It consumes the artifact the
  # read-only build job produced rather than recompiling, so what is
  # published is exactly what was tested.
  publish-dev:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # move the dev-latest tag and update its release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the tested build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flash-parts-${{ github.sha }}
          path: dist

      - name: Publish checksums for every flash part
        run: |
          ( cd dist && sha256sum ./*.bin > LoRaTraceRX-dev-SHA256SUMS.txt )
          {
            echo "commit=${GITHUB_SHA}"
            echo "built_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run=${GITHUB_RUN_ID}"
          } > dist/LoRaTraceRX-dev-BUILDINFO.txt
          cat dist/LoRaTraceRX-dev-SHA256SUMS.txt

      - name: Move dev-latest tag
        run: |
          git tag -f dev-latest
          git push origin -f dev-latest

      - name: Update rolling dev release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: dev-latest
          name: "Dev build (latest main)"
          body: |
            Automatically rebuilt from the latest commit on `main`
            (${{ github.sha }}). **Not a tagged release** — may be broken,
            untested on hardware, or mid-phase. Check docs/STATUS.md on
            that commit for what's actually verified before trusting this
            build.

            Stable download link (always the current main):
            https://github.com/${{ github.repository }}/releases/download/dev-latest/LoRaTraceRX-dev.bin
          prerelease: true
          files: |
            dist/LoRaTraceRX-dev*.bin
            dist/LoRaTraceRX-dev-SHA256SUMS.txt
            dist/LoRaTraceRX-dev-BUILDINFO.txt

name: Deploy web flasher

# Rebuilds and redeploys the GitHub Pages web-flasher site (web-flasher/)
# whenever there's a new binary to offer:
#   - `release: released` fires when a release is published (a maintainer
#     manually publishing a v1.0.0-style draft — see release.yml — or the
#     first-ever creation of the dev-latest prerelease). By the time this
#     fires, release.yml's own job (which built the draft) has long since
#     finished, so its assets are already attached — safe.
#   - `workflow_run` on Build catches every later dev-latest *update*: that
#     release already exists after its first publish, so re-uploading
#     assets to it is an edit, not a new "released" event. Also safe: Build
#     uploads dev-latest's assets as a step within its own job, before the
#     job (and so the whole workflow) completes, so this can't fire early.
# Deliberately does NOT react to release.yml's workflow_run: a v1.0.5/v1.0.6
# run once showed that racing an event against release.yml's own ~2-minute
# asset-upload step (rather than something gated on it) fails with "no
# assets to download" if this fires first. release.yml now dispatches this
# workflow itself, via `needs:` on the job that uploads those assets, which
# is ordered by construction instead of raced — see its dispatch-deploy job.
on:
  release:
    types: [released]
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # A `release: released` run carries the TAG as its ref, not a branch
  # (head_branch=v1.0.5). The github-pages environment's deployment-branch
  # policy only accepts the default branch, so such a run is rejected before
  # a single step executes -- "Tag v1.0.5 is not allowed to deploy to
  # github-pages" (runs 33831888472 and 33819824654 both died at 0 steps in
  # ~2s; every main-ref run completes all 11). Re-enter the workflow on main,
  # where the deploy is allowed; the dispatched run picks up the
  # just-published release through `gh release view` exactly as it would
  # have. workflow_dispatch is one of the two events GitHub still fires when
  # triggered with GITHUB_TOKEN, so this does not silently no-op.
  #
  # Deliberately NOT solved by dropping deploy's `environment:` block: that
  # block is the Pages deployment gate and actions/deploy-pages documents it
  # as required, so removing it trades a loud, understood failure for an
  # unverified one -- and drops the deployment URL from the Actions UI.
  # Fixing this in repo settings instead (github-pages -> deployment
  # branches -> also allow `v*` tags) would make this job unnecessary.
  dispatch-on-main:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run on main, where the environment gate allows deploying
        run: gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    # `release` is handled by dispatch-on-main above and comes back around as
    # a workflow_dispatch on an allowed ref; deploying it here would just hit
    # the environment gate again.
    if: >-
      github.event_name != 'release' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # `gh release view` with no tag argument resolves to the latest
      # release that is neither a draft nor a prerelease — exactly "the
      # current stable build" with no separate version lookup needed. If
      # none has ever been published, this exits non-zero; that's a real
      # state (pre-v1.0, or a release just un-published), not an error, so
      # it's handled rather than failing the job.
      - name: Look up the latest stable release
        id: stable
        run: |
          if tag="$(gh release view --json tagName -q .tagName -R "$GITHUB_REPOSITORY" 2>/dev/null)"; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compute build timestamp
        id: ts
        run: echo "value=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      # Fatal on purpose, unlike the stable lookup above: the dev track is
      # not optional to this site — build_web_flasher_site.py copies it
      # unconditionally, and only `stable` is treated as optional there. So
      # this stays a hard failure; it just explains itself instead of
      # surfacing a bare `gh` error, since the fix ("run Build on main once
      # to create dev-latest") is not obvious from gh's own message.
      - name: Download dev-latest assets
        run: |
          if ! gh release download dev-latest -R "$GITHUB_REPOSITORY" -D dev-assets --clobber; then
            echo "::error::Could not download the 'dev-latest' release assets. The web flasher's dev track is required (scripts/build_web_flasher_site.py copies it unconditionally). dev-latest is created by build.yml's first push to main — if this repo has never had one, or the release was deleted, re-run Build on main before this workflow."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download stable release assets
        if: steps.stable.outputs.found == 'true'
        run: gh release download "${{ steps.stable.outputs.tag }}" -R "$GITHUB_REPOSITORY" -D stable-assets --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # Copies binaries into the site instead of pointing the manifest at
      # GitHub's release-asset URLs: those redirect to
      # release-assets.githubusercontent.com, which sends no
      # Access-Control-Allow-Origin — a browser fetch() from the Pages
      # origin would be CORS-blocked. Same-origin files avoid that.
      - name: Assemble site
        run: python3 scripts/build_web_flasher_site.py
        env:
          OUT_DIR: site
          TEMPLATE: web-flasher/index.html
          REPO_URL: https://github.com/${{ github.repository }}
          BUILD_TIMESTAMP: ${{ steps.ts.outputs.value }}
          DEV_DIR: dev-assets
          STABLE_DIR: stable-assets
          STABLE_VERSION: ${{ steps.stable.outputs.tag }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

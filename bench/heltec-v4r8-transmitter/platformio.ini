[env:heltec-v4r8]
platform = espressif32
; PlatformIO has no dedicated V4 R8 board definition. This bench-only
; transmitter uses the generic S3 target and its explicitly verified pin map.
board = esp32-s3-devkitc-1
framework = arduino
; The generic N8 board definition defaults the *bootloader* image header to
; 8 MB.  V4 R8 is N16R8, and an 8 MB bootloader header makes it reset before
; app_main() on this ESP32-S3.  Set the upload geometry explicitly so both
; the bootloader and app headers describe the installed 16 MB flash.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.7.1
    olikraus/U8g2@^2.36.5
